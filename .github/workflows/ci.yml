name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test

  # The fixtures are views the kernel wrote for gallery parts. Each one is
  # written to STEP and read back by OpenCascade (cadquery-ocp): one closed
  # valid solid per part, and no edge tolerance above 1e-3 mm.
  judge:
    name: OpenCascade judge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cadquery-ocp==8.0.1 ezdxf==1.4.5 "pymupdf>=1.26" "pikepdf>=9"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch veraPDF
        run: curl -sSfL -o verapdf.jar https://repo1.maven.org/maven2/org/verapdf/apps/greenfield-apps/1.28.2/greenfield-apps-1.28.2.jar
      - run: cargo build --release --example view2step --example view2dxf --example view2pdf
      - name: Write and judge every fixture
        run: |
          mkdir -p out
          for v in fixtures/*.view.json; do
            n=$(basename "$v" .view.json)
            target/release/examples/view2step "$v" "out/$n.step" "$n"
          done
          python -I judge/judge.py out/*.step
      # The flat fixtures are also written as DXF and read back by ezdxf.
      # A folded fixture only yields DXF for the flat plates in it, and
      # may yield none at all.
      - name: Write and judge every flat pattern
        run: |
          for v in fixtures/*.view.json; do
            n=$(basename "$v" .view.json)
            case "$n" in mesh_*) continue;; esac
            if ! target/release/examples/view2dxf "$v" "out/dxf/$n"; then
              case "$n" in *_flat*) exit 1;; esac
            fi
          done
          python -I judge/judge_dxf.py out/dxf/*/*.dxf
      # And drawn as a PDF/A-2b dossier, judged against the DXF (flat
      # sheets) or the view (folded sheets): every feature dimensioned, no
      # invented numbers, no text collisions, veraPDF PASS.
      - name: Draw and judge every dossier
        run: |
          mkdir -p out/pdf
          for v in fixtures/*.view.json; do
            n=$(basename "$v" .view.json)
            case "$n" in mesh_*|four_down_mirrored) continue;; esac
            target/release/examples/view2pdf "$v" "out/pdf/$n.pdf"
          done
          python -I judge/judge_pdf.py --dxf out/dxf --views fixtures --verapdf verapdf.jar out/pdf/*.pdf

  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
      - run: npm install --global wasm-pack@0.13.1
      - run: npm install --no-audit --no-fund
        working-directory: npm
      - run: npm run build
        working-directory: npm
      - run: npm run smoke
        working-directory: npm
      - run: npm pack
        working-directory: npm
      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        run: npm publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

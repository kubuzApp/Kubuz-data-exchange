[package]
name = "kubuz-data-exchange"
version = "0.3.1"
edition = "2021"
description = "File formats (STEP AP214, DXF flat patterns, PDF drawings) from the Kubuz kernel's exact-geometry view"
license = "MIT"
repository = "https://github.com/kubuzApp/Kubuz-data-exchange"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.9"
wasm-bindgen = { version = "0.2", optional = true }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
opt-level = "s"
